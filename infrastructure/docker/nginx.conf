worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
    location /api/ {
      # Upstream error logs can include the original URL and sensitive query parameters.
      error_log /dev/null;
      # Re-resolve the Compose service after its container is replaced.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 504 =503 @api_unavailable;
    }
    location @api_unavailable {
      default_type application/json;
      return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен. Попробуйте позже","field_errors":{},"request_id":"$request_id"}';
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
